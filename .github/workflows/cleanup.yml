name: Cleanup Successful CodeQL Runs

on:
  schedule:
    - cron: '0 * * * *' # jede Stunde
  workflow_dispatch: # manuell auslösbar

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Delete successful workflow runs
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          OWNER: emergency-german
          REPO: termin-buchen
          WORKFLOW_FILE_NAME: github-code-scanning/codeql.yml
        run: |
          echo "Fetching workflow ID..."
          WORKFLOW_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/workflows" \
            | jq -r ".workflows[] | select(.path==\".github/workflows/$WORKFLOW_FILE_NAME\") | .id")
          
          if [ -z "$WORKFLOW_ID" ]; then
            echo "Workflow not found!"
            exit 1
          fi
          
          echo "Fetching successful runs..."
          RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW_ID/runs?status=success" \
            | jq -r '.workflow_runs[].id')
          
          if [ -z "$RUNS" ]; then
            echo "No successful runs found."
            exit 0
          fi
          
          for RUN_ID in $RUNS; do
            echo "Deleting run $RUN_ID..."
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$RUN_ID"
          done
          
          echo "✅ Done!"
