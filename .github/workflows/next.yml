name: Build and Deploy Next.js

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: npm ci

      - name: Cache Prisma Client
        uses: actions/cache@v3
        with:
          path: node_modules/.prisma
          key: prisma-client-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: |
            prisma-client-

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Cache Next.js Build
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: next-build-${{ github.sha }}
          restore-keys: |
            next-build-

      - name: Build Next.js
        run: npx --yes next build

      - name: Deploy to Admin-Dash Repo
        if: success()
        env:
          TARGET_REPO: maxytmaxyt/admin-dash-vikilux
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          SRC_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "SRC_DIR = $SRC_DIR"

          TEMP_DIR=$(mktemp -d)
          echo "Temp dir: $TEMP_DIR"
          cd "$TEMP_DIR"
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git"

          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
          else
            git checkout -B main
          fi

          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next/cache' \
            --exclude='out' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='*.log' \
            "$SRC_DIR/" "$TEMP_DIR/"

          cd "$TEMP_DIR"
          git config user.name "maxytmaxyt"
          git config user.email "${EMAIL}"

          if git rev-parse --verify --quiet HEAD >/dev/null; then
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Deploy Next.js source [ci skip]"
              git push origin main
            else
              echo "Keine Änderungen zum Committen."
            fi
          else
            git add -A
            git commit -m "Initial deploy: Deploy Next.js source [ci skip]"
            git push --set-upstream origin main
          fi
