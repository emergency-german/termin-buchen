name: Build and Deploy Next.js

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npx --yes next build

      - name: Deploy to Admin-Dash Repo
        if: success()
        env:
          TARGET_REPO: maxytmaxyt/admin-dash-vikilux
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          # Ziel-Repo klonen
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git target
          
          # Nur sichtbare Dateien kopieren, versteckte und Build-Dateien ignorieren
          rsync -av --exclude='.*' --exclude='node_modules' --exclude='.next' --exclude='out' --exclude='dist' --delete ./ target/

          # Commit & Push
          cd target
          git config user.name "maxytmaxyt"
          git config user.email "${EMAIL}"
          git add .
          git commit -m "Deploy Next.js source [ci skip]" || echo "No changes to commit"
          git push origin main
