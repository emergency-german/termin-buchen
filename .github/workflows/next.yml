name: Build and Deploy Next.js

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npx --yes next build

      - name: Deploy to Admin-Dash Repo
        if: success()
        env:
          TARGET_REPO: maxytmaxyt/admin-dash-vikilux
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          SRC_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "SRC_DIR = $SRC_DIR"

          # Temp-Verzeichnis anlegen
          TEMP_DIR=$(mktemp -d)
          echo "Temp dir: $TEMP_DIR"

          # In Temp-Dir wechseln und Git-Repo initialisieren
          cd "$TEMP_DIR"
          git init

          # Remote mit Token setzen (erlaubt push)
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git"

          # Wenn origin/main existiert -> holen und lokale main darauf setzen,
          # sonst neue lokale main erstellen
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
          else
            git checkout -B main
          fi

          # Sicherheits-Check: sicherstellen, dass wir in einem Git-Repo sind
          if [ ! -d ".git" ]; then
            echo "Fehler: .git Verzeichnis fehlt im Temp-Repo"
            exit 1
          fi

          # rsync: kopiere exakt vom Actions-Workspace in das Temp-Repo
          # Hinweis: .env* wird NICHT ausgeschlossen (wird also mitkopiert)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='out' \
            --exclude='dist' \
            --exclude='*.log' \
            "$SRC_DIR/" "$TEMP_DIR/"

          echo "Inhalt von $TEMP_DIR nach rsync:"
          ls -la "$TEMP_DIR" | sed -n '1,200p'

          # Git: commit + push (unterscheide initial commit vs. update)
          cd "$TEMP_DIR"
          git config user.name "maxytmaxyt"
          git config user.email "${EMAIL}"

          if git rev-parse --verify --quiet HEAD >/dev/null; then
            # Es gibt ein HEAD: prüfen ob Änderungen vorliegen
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Deploy Next.js source [ci skip]"
              git push origin main
            else
              echo "Keine Änderungen zum Committen."
            fi
          else
            # Kein HEAD vorhanden -> Initial-Commit
            git add -A
            git commit -m "Initial deploy: Deploy Next.js source [ci skip]"
            git push --set-upstream origin main
          fi
