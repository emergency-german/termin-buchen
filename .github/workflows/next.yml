name: Build and Deploy Next.js

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npx --yes next build

      - name: Deploy to Admin-Dash Repo
        if: success()
        env:
          TARGET_REPO: maxytmaxyt/admin-dash-vikilux
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          # Temp-Verzeichnis für Deployment
          TEMP_DIR=$(mktemp -d)
          
          # Ziel-Repo klonen
          git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git $TEMP_DIR
          
          # Alte Dateien löschen außer .git
          cd $TEMP_DIR
          find . -mindepth 1 -not -name '.git' -exec rm -rf {} +

          # Dateien aus Workflow-Repo kopieren
          rsync -av --exclude='.*' --exclude='node_modules' --exclude='.next' --exclude='out' --exclude='dist' ../ ./ 

          # Commit & Push
          git config user.name "maxytmaxyt"
          git config user.email "${EMAIL}"
          git add .
          git commit -m "Deploy Next.js source [ci skip]" || echo "No changes to commit"
          git push origin main
